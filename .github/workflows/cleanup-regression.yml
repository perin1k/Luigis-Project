name: Cleanup affected-screen comparison
on:
  push:
    branches: [dev]
    paths: ['.github/workflows/cleanup-regression.yml']
  workflow_dispatch:
    inputs:
      phase:
        description: Collect synthetic candidates or strictly compare reviewed references
        required: true
        default: compare
        type: choice
        options: [collect, compare]
permissions:
  contents: read
jobs:
  affected-screens:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-15, ubuntu-24.04]
        suite: [public, pricing, scheduling, payments, staff, operations]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      PLAYWRIGHT_BROWSERS_PATH: node_modules/.cache/ms-playwright
      CLEANUP_SUITE: ${{ matrix.suite }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.1'
      - run: npm ci --ignore-scripts
      - name: Locate Windows OpenSSL
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $strGitRoot = Split-Path (Split-Path (Get-Command git).Source)
          foreach ($strRelative in @('mingw64/bin', 'usr/bin')) {
            $strDirectory = Join-Path $strGitRoot $strRelative
            if (Test-Path -LiteralPath $strDirectory) { Add-Content -LiteralPath $env:GITHUB_PATH -Value $strDirectory }
          }
      - if: runner.os == 'Linux'
        run: npx --no-install playwright install --with-deps chromium firefox webkit
      - if: runner.os != 'Linux'
        run: npx --no-install playwright install chromium firefox webkit
      - if: runner.os == 'macOS'
        run: defaults write org.webkit.Playwright AppleKeyboardUIMode -int 2
      - name: Run affected screens
        shell: pwsh
        run: |
          $arrArguments = @('node_modules/@playwright/test/cli.js', 'test', '-c', 'playwright.cleanup-regression.config.js')
          $strUpdate = if ('${{ github.event_name }}' -eq 'push' -or '${{ inputs.phase }}' -eq 'collect') { 'all' } else { 'none' }
          $arrArguments += "--update-snapshots=$strUpdate"
          if ('${{ runner.os }}' -eq 'Windows') {
            $arrArguments += @('--project=chromium-desktop', '--project=chromium-mobile', '--project=firefox-desktop', '--project=firefox-mobile')
          }
          & node @arrArguments
          exit $LASTEXITCODE
      - name: Internal synthetic candidates
        if: always() && (github.event_name == 'push' || inputs.phase == 'collect')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cleanup-regression-${{ matrix.os }}-${{ matrix.suite }}
          path: tests/**/*-snapshots/cleanup-regression/**/*.png
          if-no-files-found: error
          retention-days: 2
      - name: Internal comparison differences
        if: failure() && inputs.phase == 'compare'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cleanup-regression-differences-${{ matrix.os }}-${{ matrix.suite }}
          path: |
            test-results/cleanup-regression-*/**/*-actual.png
            test-results/cleanup-regression-*/**/*-diff.png
          if-no-files-found: warn
          retention-days: 2
