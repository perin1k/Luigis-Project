name: INT-02 private verifier rehearsal
on:
  push:
    branches: [dev]
    paths:
      - 'scripts/hosted-int02*.js'
      - 'scripts/verify-hosted-int02.js'
      - 'tests/unit/hosted-int02-policy.test.js'
      - 'tests/operations/hosted-int02-rehearsal.js'
      - '.github/workflows/hosted-int02-verification.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rehearsal:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    env:
      PLAYWRIGHT_BROWSERS_PATH: node_modules/.cache/ms-playwright
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.1'
      - run: npm ci --ignore-scripts
      - run: npx --no-install playwright install --with-deps chromium
      - run: node --test tests/unit/hosted-int02-policy.test.js
      - run: node tests/operations/hosted-int02-rehearsal.js
