name: Focused OPS monitoring verification
on:
  push:
    branches: [dev]
    paths:
      - 'src/operations/**'
      - 'tests/unit/operations.test.js'
      - 'tests/unit/host-monitoring.test.js'
      - 'scripts/configure-monitoring.js'
      - 'deploy/monitoring.json'
      - '.github/workflows/monitoring-verification.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.14.1'
      - run: npm ci --ignore-scripts
      - run: node --test tests/unit/operations.test.js tests/unit/host-monitoring.test.js
