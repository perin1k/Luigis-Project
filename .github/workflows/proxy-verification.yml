name: Nginx security and integration verification
on:
  push:
    branches: [dev]
    paths:
      - 'src/security/proxy-boundary.js'
      - 'scripts/nginx-config.js'
      - 'scripts/setup-nginx.js'
      - 'tests/unit/proxy-boundary.test.js'
      - 'tests/operations/nginx-rehearsal.js'
      - 'deploy/nginx-service.conf'
      - '.github/workflows/proxy-verification.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proxy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PLAYWRIGHT_BROWSERS_PATH: node_modules/.cache/ms-playwright
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.1'
      - run: npm ci --ignore-scripts
      - run: sudo apt-get update && sudo apt-get install --no-install-recommends -y nginx
      - run: sudo systemctl stop nginx
      - run: node --test --test-concurrency=1 tests/unit/proxy-boundary.test.js tests/unit/anonymous-limits.test.js tests/unit/customer-accounts.test.js tests/unit/auth-router.test.js tests/unit/release.test.js tests/unit/tls-install.test.js
      - run: npx --no-install playwright install --with-deps chromium
      - run: node tests/operations/nginx-rehearsal.js
