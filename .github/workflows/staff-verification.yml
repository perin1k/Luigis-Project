name: Staff authentication verification

on:
  push:
    branches: [dev]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'playwright.staff*.js'
      - 'package*.json'
      - '.gitattributes'
      - '.github/workflows/staff-verification.yml'
  pull_request:
    branches: [dev]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'playwright.staff*.js'
      - 'package*.json'
      - '.gitattributes'
      - '.github/workflows/staff-verification.yml'

permissions:
  contents: read

concurrency:
  group: staff-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  staff:
    name: Staff (${{ matrix.os }}, ${{ matrix.coverage }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.coverage == 'diagnostic' }}
    timeout-minutes: 60
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/node_modules/.cache/ms-playwright
      # Temporary, human-approved candidate collection; restore false after review.
      STAFF_VISUAL_REVIEW: 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            coverage: required
            snapshot_os: linux
            projects: ''
          - os: windows-2022
            coverage: required
            snapshot_os: win32
            projects: --project=chromium-desktop --project=chromium-mobile --project=firefox-desktop --project=firefox-mobile
          - os: macos-15
            coverage: required
            snapshot_os: darwin
            projects: ''
          - os: windows-2022
            coverage: diagnostic
            snapshot_os: win32
            projects: --project=webkit-desktop --project=webkit-mobile
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Use the shared verification runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.14.1'
      - name: Install locked dependencies
        run: npm ci
      - name: Locate OpenSSL on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command openssl -ErrorAction SilentlyContinue)) {
            $strGitRoot = Split-Path (Split-Path (Get-Command git).Source)
            $objOpenSsl = Get-ChildItem -LiteralPath $strGitRoot -Filter openssl.exe -Recurse -File | Select-Object -First 1
            if (-not $objOpenSsl) { throw 'OpenSSL is required for disposable HTTPS fixtures.' }
            Add-Content -LiteralPath $env:GITHUB_PATH -Value $objOpenSsl.DirectoryName
          }
      - name: Record tools
        run: |
          node --version
          npm --version
          git --version
          openssl version
          npx playwright --version
      - name: Verify staff services and HTTPS integration
        if: matrix.coverage == 'required'
        timeout-minutes: 8
        run: npm run test:staff:unit
      - name: Install locked browsers and Linux system prerequisites
        if: runner.os == 'Linux'
        timeout-minutes: 30
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Install locked native browsers
        if: runner.os != 'Linux'
        timeout-minutes: 15
        run: npx playwright install chromium firefox webkit
      - name: Verify staff browser behavior and cookie enforcement
        timeout-minutes: 17
        run: npm run test:staff:functional -- ${{ matrix.projects }}
      - name: Collect native visual candidates or compare reviewed references
        id: native-visual
        if: matrix.coverage == 'required'
        timeout-minutes: 8
        run: npx playwright test -c playwright.staff.config.js --grep visual --reporter=list --output=test-results/staff-native-visual --update-snapshots=${{ env.STAFF_VISUAL_REVIEW == 'true' && 'all' || 'none' }} ${{ matrix.projects }}
      - name: Temporarily retain synthetic native visual candidates for review
        if: ${{ success() && steps.native-visual.outcome == 'success' && env.STAFF_VISUAL_REVIEW == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: staff-native-visual-${{ matrix.snapshot_os }}
          path: |
            tests/staff-e2e/staff.spec.js-snapshots/*-${{ matrix.snapshot_os }}.png
            tests/staff-e2e/roles.spec.js-snapshots/*-${{ matrix.snapshot_os }}.png
          retention-days: 1
          if-no-files-found: error
