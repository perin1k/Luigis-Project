name: Storage verification

on:
  push:
    branches: [dev]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'tests/unit/**'
      - 'tests/fixtures/**'
      - 'package*.json'
      - '.gitattributes'
      - '.github/workflows/storage-verification.yml'
  pull_request:
    branches: [dev]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'tests/unit/**'
      - 'tests/fixtures/**'
      - 'package*.json'
      - '.gitattributes'
      - '.github/workflows/storage-verification.yml'

permissions:
  contents: read

concurrency:
  group: storage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  storage:
    name: Storage (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Use the shared verification runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.14.1'
      - name: Record runtime versions
        run: |
          node --version
          npm --version
          git --version
      - name: Install locked dependencies
        run: npm ci
      - name: Verify disposable storage and migrations
        run: npm run test:storage
