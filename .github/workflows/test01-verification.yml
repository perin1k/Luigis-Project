name: TEST-01 menu and customer acceptance

on:
  workflow_dispatch:
    inputs:
      references:
        description: 'Collect synthetic references for internal review, or compare reviewed references'
        type: choice
        options: [none, all]
        default: none

permissions:
  contents: read

concurrency:
  group: test01-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checkpoint:
    name: TEST-01 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            projects: --project=chromium-desktop --project=chromium-mobile --project=firefox-desktop --project=firefox-mobile
          - os: macos-15
            projects: ''
          - os: ubuntu-24.04
            projects: ''
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/node_modules/.cache/ms-playwright
      TEST01_NATIVE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.14.1'
      - run: npm ci
      - name: Locate OpenSSL runtime on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $strGitRoot = Split-Path (Split-Path (Get-Command git).Source)
          foreach ($strRelative in @('mingw64/bin', 'usr/bin')) {
            $strDirectory = Join-Path $strGitRoot $strRelative
            if (Test-Path -LiteralPath $strDirectory) { Add-Content -LiteralPath $env:GITHUB_PATH -Value $strDirectory }
          }
      - name: Use the main Ubuntu archive for browser prerequisites
        if: runner.os == 'Linux'
        shell: bash
        run: |
          bArchiveFound=false
          for strSource in /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources; do
            if [[ -f "$strSource" ]]; then
              sudo sed -i 's|http://azure\.archive\.ubuntu\.com/ubuntu|https://archive.ubuntu.com/ubuntu|g;s|https://azure\.archive\.ubuntu\.com/ubuntu|https://archive.ubuntu.com/ubuntu|g;s|mirror+file:/etc/apt/apt-mirrors\.txt|https://archive.ubuntu.com/ubuntu|g' "$strSource"
              if grep -Eq '^(URIs:|deb ).*https://archive\.ubuntu\.com/ubuntu' "$strSource"; then bArchiveFound=true; fi
            fi
          done
          if [[ "$bArchiveFound" != true ]]; then echo 'No active Ubuntu archive source selected.' >&2; exit 1; fi
      - if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium firefox webkit
      - if: runner.os != 'Linux'
        run: npx playwright install chromium firefox webkit
      - name: Record runtime and focused service checks
        run: |
          node --version
          npm --version
          npx playwright --version
          openssl version
          node --test tests/unit/menu-service.test.js tests/unit/menu-http.test.js tests/unit/pricing-http.test.js tests/unit/catalog-pricing.test.js tests/unit/order-pricing.test.js tests/unit/http-hosting.test.js
      - name: Shared menu, customer and permission journeys
        run: npx playwright test -c playwright.test01.config.js --update-snapshots=${{ inputs.references }} ${{ matrix.projects }}
      - name: Availability, branded errors, visuals and accessibility
        run: npx playwright test -c playwright.test01-public.config.js --update-snapshots=${{ inputs.references }} ${{ matrix.projects }}
      - name: Persisted customer recovery journeys
        run: npx playwright test -c playwright.pricing.config.js --grep 'unavailable selected topping|changed database prices|network failures retain|withdraws stale prices' ${{ matrix.projects }}
      - name: Collect synthetic references only when explicitly requested
        if: success() && inputs.references == 'all'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: test01-references-${{ matrix.os }}
          path: |
            tests/staff-orders-e2e/menu.spec.js-snapshots/test01-ci/*.png
            tests/staff-orders-e2e/menu-customer.spec.js-snapshots/test01-ci/*.png
            tests/e2e/availability.spec.js-snapshots/test01-ci/*.png
          retention-days: 2
          if-no-files-found: error
