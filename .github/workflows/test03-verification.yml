name: TEST-03 fulfillment, tracking and reporting acceptance

on:
  workflow_dispatch:
    inputs:
      phase:
        description: 'Collect synthetic candidates for review, or compare reviewed references'
        required: true
        default: compare
        type: choice
        options: [collect, compare, collect-approval, compare-approval]

permissions:
  contents: read

concurrency:
  group: test03-${{ github.ref }}-${{ inputs.phase || 'initial' }}
  cancel-in-progress: true

jobs:
  checkpoint:
    if: github.ref == 'refs/heads/dev'
    name: TEST-03 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: win32
            projects: --project=chromium-desktop --project=chromium-mobile --project=firefox-desktop --project=firefox-mobile
          - os: macos-15
            platform: darwin
            projects: ''
          - os: ubuntu-24.04
            platform: linux
            projects: ''
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/node_modules/.cache/ms-playwright
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.1'
      - run: npm ci
      - name: Locate OpenSSL runtime on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $strGitRoot = Split-Path (Split-Path (Get-Command git).Source)
          foreach ($strRelative in @('mingw64/bin', 'usr/bin')) {
            $strDirectory = Join-Path $strGitRoot $strRelative
            if (Test-Path -LiteralPath $strDirectory) { Add-Content -LiteralPath $env:GITHUB_PATH -Value $strDirectory }
          }
      - name: Use the main Ubuntu archive for browser prerequisites
        if: runner.os == 'Linux'
        shell: bash
        run: |
          bArchiveFound=false
          for strSource in /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources; do
            if [[ -f "$strSource" ]]; then
              sudo sed -i 's|http://azure\.archive\.ubuntu\.com/ubuntu|https://archive.ubuntu.com/ubuntu|g;s|https://azure\.archive\.ubuntu\.com/ubuntu|https://archive.ubuntu.com/ubuntu|g;s|mirror+file:/etc/apt/apt-mirrors\.txt|https://archive.ubuntu.com/ubuntu|g' "$strSource"
              if grep -Eq '^(URIs:|deb ).*https://archive\.ubuntu\.com/ubuntu' "$strSource"; then bArchiveFound=true; fi
            fi
          done
          if [[ "$bArchiveFound" != true ]]; then echo 'No active Ubuntu archive source selected.' >&2; exit 1; fi
      - if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium firefox webkit
      - if: runner.os != 'Linux'
        run: npx playwright install chromium firefox webkit
      - name: Enable native macOS keyboard navigation for WebKit
        if: runner.os == 'macOS'
        run: |
          defaults write org.webkit.Playwright AppleKeyboardUIMode -int 2
          defaults read org.webkit.Playwright AppleKeyboardUIMode
      - name: Connected checkpoint journeys and candidate collection
        if: inputs.phase == 'collect'
        # Retain native functional and unchanged analytics evidence. References on
        # operational/tracking pages now wrap deterministically without masking layout.
        run: npx playwright test -c playwright.test03.config.js --grep 'visual|private tracking explains persisted inventory|lost refund response|opaque reference wrapping' --grep-invert 'analytics.*visual' --update-snapshots=all ${{ matrix.projects }}
      - name: Strict reviewed-reference comparison
        if: inputs.phase == 'compare'
        # Reuse passing collection journeys on unchanged application/fixture bytes.
        # Compare every visual case and run the new cross-feature integration.
        run: npx playwright test -c playwright.test03.config.js --grep 'visual|private tracking explains persisted inventory|lost refund response|opaque reference wrapping' --grep-invert 'analytics.*visual' --update-snapshots=none ${{ matrix.projects }}
      - name: Collect corrected approval-row visuals and regression
        if: inputs.phase == 'collect-approval'
        run: npx playwright test -c playwright.test03.config.js --grep 'admin detail visual|refund .*visual|notification .*visual|approval rows contain|refund submission requires|persisted pending refunds' --update-snapshots=all ${{ matrix.projects }}
      - name: Compare corrected approval-row visuals and regression
        if: inputs.phase == 'compare-approval'
        run: npx playwright test -c playwright.test03.config.js --grep 'admin detail visual|refund .*visual|notification .*visual|approval rows contain|refund submission requires|persisted pending refunds' --update-snapshots=none ${{ matrix.projects }}
      - name: Upload synthetic candidates for bounded internal review
        if: always() && (inputs.phase == 'collect' || inputs.phase == 'collect-approval')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: test03-candidates-${{ matrix.os }}
          path: tests/staff-orders-e2e/*-snapshots/cleanup-regression/*-${{ matrix.platform }}.png
          if-no-files-found: error
          retention-days: 2
      - name: Retain bounded synthetic comparison differences
        if: failure() && (inputs.phase == 'compare' || inputs.phase == 'compare-approval')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: test03-differences-${{ matrix.os }}
          path: |
            test-results/test03/**/*-actual.png
            test-results/test03/**/*-diff.png
          if-no-files-found: warn
          retention-days: 2
