# Drop-in for nginx.service; use only the reviewed private Luigi's configuration.
[Service]
ExecStartPre=
ExecStartPre=/usr/sbin/nginx -t -q -c /etc/luigis/proxy/nginx.conf
ExecStart=
ExecStart=/usr/sbin/nginx -c /etc/luigis/proxy/nginx.conf -g "daemon on; master_process on;"
ExecReload=
ExecReload=/usr/sbin/nginx -s reload -c /etc/luigis/proxy/nginx.conf
UMask=0077
